[project]
name = "locserver"
version = "0.1.0"
description = "Self-hosted markerless visual-localisation server (ALIKED + LightGlue + COLMAP) for an AR-to-VR portal app"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "torch==2.14.1",
    "torchvision",
    "lightglue",
    "pycolmap>=3.12",
    "numpy",
    "opencv-python",
    "fastapi",
    "uvicorn",
    "python-multipart",
]

[project.scripts]
locserver-build-map = "locserver.build_map:main"
locserver-serve = "locserver.server:main"
locserver-evaluate = "locserver.evaluate:main"
locserver-localize = "locserver.localize_cli:main"

[dependency-groups]
dev = ["pytest", "httpx", "scipy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/locserver"]

[tool.hatch.metadata]
allow-direct-references = true

# PyTorch 2.14.1 + CUDA 12.6 is the last official Windows build line that still
# ships kernels for Pascal GPUs (GTX 10xx, sm_61). See README "GPU support".
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
lightglue = { git = "https://github.com/cvg/LightGlue.git" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: needs model weights / GPU or CPU inference"]
